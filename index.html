<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Night Cage: অন্ধকারের ফাঁদে</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: #14141d;
            --accent-color: #e50914;
            --text-color: #e0e0e0;
            --border-color: #2a2a3d;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            text-align: center;
        }
        h1 {
            color: var(--accent-color);
            font-size: 22px;
            margin-bottom: 5px;
        }
        p {
            font-size: 13px;
            color: #aaa;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1f1f2e;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            background: var(--accent-color);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #b20710;
        }
        .hidden {
            display: none !important;
        }
        #game-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin: 15px 0;
        }
        .grid-cell {
            aspect-ratio: 1;
            background: #1a1a26;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #ff5555;
        }
    </style>
</head>
<body>

    <!-- কনফিগারেশন ও মোড সিলেকশন স্ক্রিন -->
    <div class="container" id="config-screen">
        <h1>🕯️ The Night Cage: অন্ধকারের ফাঁদে</h1>
        <p>মোবাইল ও পিসি ফ্রেন্ডলি হরর বোর্ড গেম</p>
        
        <label style="font-size: 12px; color: #888; display: block; text-align: left; margin-top: 10px;">গেম মোড নির্বাচন করুন:</label>
        <select id="game-mode-select" onchange="toggleGameMode()">
            <option value="local">লোকাল পাস অ্যান্ড প্লে (Local Pass & Play)</option>
            <option value="online">অনলাইন রুম মাল্টিপ্লেয়ার (Online Room & Join)</option>
        </select>

        <!-- লোকাল মোডের অপশন -->
        <div id="local-mode-options">
            <input type="text" id="player-name-local" placeholder="আপনার নাম লিখুন..." value="সাবি্বর">
            <input type="text" id="player-name-local-2" placeholder="দ্বিতীয় খেলোয়াড়ের নাম..." value="সোহাবা">
            <button onclick="startLocalGame()" style="background: #7b2cbf;">অ্যাডভেঞ্চার শুরু করুন (Local)</button>
        </div>

        <!-- অনলাইন রুম মোডের অপশন -->
        <div id="online-mode-options" class="hidden">
            <input type="text" id="player-name-online" placeholder="আপনার নাম লিখুন (যেমন: Sabbir)">
            <button onclick="createOnlineRoom()" style="background: #007bff;">নতুন রুম কোড তৈরি করুন (Get Code)</button>
            <div id="room-code-box" class="hidden" style="background: #111; padding: 10px; border-radius: 5px; margin: 8px 0; font-size: 16px; color: #ffeb3b; font-weight: bold;"></div>
            
            <div style="margin: 10px 0; font-size: 11px; color: #666;">--- অথবা বন্ধুর কোড দিয়ে ঢুকুন ---</div>
            <input type="text" id="room-code-input" placeholder="বন্ধুর দেওয়া রুম কোড দিন" maxlength="8">
            <button onclick="joinOnlineRoom()" style="background: #28a745;">রুমে জয়েন করুন (Join)</button>
        </div>
    </div>

    <!-- গেম প্লে স্ক্রিন -->
    <div class="container hidden" id="game-screen">
        <h1 id="game-title-bar">অন্ধকারের ফাঁদে</h1>
        <p id="game-status-msg">খেলা চলছে...</p>
        
        <div id="game-grid"></div>

        <div id="online-players-box" class="hidden" style="background: #1a1a24; padding: 8px; border-radius: 5px; margin-top: 10px; font-size: 13px; color: #4ecc6d; text-align: left;"></div>

        <button onclick="leaveToMenu()" style="background: #dc3545; margin-top: 15px;">মেইন মেনুতে ফিরে যান</button>
    </div>

<script>
    // ফায়ারবেস কনফিগারেশন
    const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
        databaseURL: "YOUR_FIREBASE_DATABASE_URL",
        projectId: "YOUR_FIREBASE_PROJECT_ID",
        storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
        messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
        appId: "YOUR_FIREBASE_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentMode = "local";
    let currentRoomCode = "";
    let roomRef = null;
    let myName = "";

    function toggleGameMode() {
        currentMode = document.getElementById("game-mode-select").value;
        if (currentMode === "local") {
            document.getElementById("local-mode-options").classList.remove("hidden");
            document.getElementById("online-mode-options").classList.add("hidden");
        } else {
            document.getElementById("local-mode-options").classList.add("hidden");
            document.getElementById("online-mode-options").classList.remove("hidden");
        }
    }

    function initGrid() {
        const grid = document.getElementById("game-grid");
        grid.innerHTML = "";
        for (let i = 0; i < 36; i++) {
            const cell = document.createElement("div");
            cell.className = "grid-cell";
            cell.id = `cell-${i}`;
            cell.innerText = `[${i+1}]`;
            grid.appendChild(cell);
        }
    }

    // লোকাল পাস অ্যান্ড প্লে শুরু
    function startLocalGame() {
        const p1 = document.getElementById("player-name-local").value.trim() || "প্লায়ার ১";
        const p2 = document.getElementById("player-name-local-2").value.trim() || "প্লায়ার ২";
        
        document.getElementById("config-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("game-title-bar").innerText = `লোকাল মোড: ${p1} vs ${p2}`;
        document.getElementById("game-status-msg").innerText = `টার্ন: ${p1}`;
        document.getElementById("online-players-box").classList.add("hidden");

        initGrid();
        document.getElementById("cell-0").innerText = p1[0];
        document.getElementById("cell-1").innerText = p2[0];
    }

    // অনলাইন রুম তৈরি
    function createOnlineRoom() {
        myName = document.getElementById("player-name-online").value.trim();
        if (!myName) {
            alert("দয়া করে আগে আপনার নাম লিখুন!");
            return;
        }

        currentRoomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        roomRef = db.ref("rooms/" + currentRoomCode);

        roomRef.set({
            host: myName,
            status: "waiting",
            players: {
                [myName]: { name: myName, pos: 0 }
            }
        }).then(() => {
            const codeBox = document.getElementById("room-code-box");
            codeBox.innerText = `রুম কোড: ${currentRoomCode}`;
            codeBox.classList.remove("hidden");

            setTimeout(() => {
                enterOnlineGameScreen(currentRoomCode);
            }, 1000);
        });
    }

    // অনলাইন রুমে জয়েন
    function joinOnlineRoom() {
        myName = document.getElementById("player-name-online").value.trim();
        const codeInput = document.getElementById("room-code-input").value.trim().toUpperCase();

        if (!myName) {
            alert("দয়া করে আপনার নাম লিখুন!");
            return;
        }
        if (!codeInput) {
            alert("দয়া করে রুম কোড দিন!");
            return;
        }

        currentRoomCode = codeInput;
        roomRef = db.ref("rooms/" + currentRoomCode);

        roomRef.once("value", (snapshot) => {
            if (snapshot.exists()) {
                roomRef.child("players/" + myName).set({
                    name: myName,
                    pos: 0
                }).then(() => {
                    enterOnlineGameScreen(currentRoomCode);
                });
            } else {
                alert("এই কোডের কোনো রুম পাওয়া যায়নি!");
            }
        });
    }

    function enterOnlineGameScreen(code) {
        document.getElementById("config-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("game-title-bar").innerText = `অনলাইন রুম: ${code}`;
        document.getElementById("online-players-box").classList.remove("hidden");

        initGrid();
        
        roomRef.child("players").on("value", (snapshot) => {
            const players = snapshot.val();
            let listHTML = "👥 রুমে যুক্ত আছেন:<br>";
            
            for (let i = 0; i < 36; i++) {
                document.getElementById(`cell-${i}`).innerText = `[${i+1}]`;
            }

            if (players) {
                Object.values(players).forEach(p => {
                    listHTML += `• ${p.name}<br>`;
                    if(document.getElementById(`cell-${p.pos}`)) {
                        document.getElementById(`cell-${p.pos}`).innerText = p.name[0].toUpperCase();
                    }
                });
            }
            document.getElementById("online-players-box").innerHTML = listHTML;
        });
    }

    function leaveToMenu() {
        if (currentMode === "online" && roomRef && myName) {
            roomRef.child("players/" + myName).remove();
        }
        location.reload();
    }
</script>

</body>
</html>
