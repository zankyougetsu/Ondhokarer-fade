<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Night Cage: অন্ধকারের ফাঁদে</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: #14141d;
            --accent-color: #e50914;
            --text-color: #e0e0e0;
            --border-color: #2a2a3d;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            text-align: center;
        }
        h1 {
            color: var(--accent-color);
            font-size: 22px;
            margin-bottom: 5px;
        }
        p {
            font-size: 13px;
            color: #aaa;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1f1f2e;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            background: var(--accent-color);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #b20710;
        }
        .hidden {
            display: none !important;
        }
        #game-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin: 15px 0;
        }
        .grid-cell {
            aspect-ratio: 1;
            background: #1a1a26;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #ff5555;
        }
        .connected-box {
            background: #1a1a24;
            border: 1px dashed #444;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- লবি ও রুম অপশন স্ক্রিন -->
    <div class="container" id="menu-screen">
        <h1>🕯️ The Night Cage: অন্ধকারের ফাঁদে</h1>
        <p>অনলাইন মাল্টিপ্লেয়ার হরর বোর্ড গেম</p>
        
        <input type="text" id="player-name" placeholder="আপনার নাম লিখুন (যেমন: Sabbir)..." maxlength="15">
        
        <button onclick="createRoom()">নতুন রুম তৈরি করুন (Create Room)</button>
        <div style="margin: 8px 0; font-size: 12px; color: #776;">--- অথবা বন্ধুর দেওয়া রুমে ঢুকুন ---</div>
        
        <input type="text" id="room-code-input" placeholder="রুম কোড দিন (যেমন: ABC123)" maxlength="10">
        <button onclick="joinRoom()" style="background: #28a745;">রুমে প্রবেশ করুন (Join Room)</button>
    </div>

    <!-- মূল গেম ও মাল্টিপ্লেয়ার রুম স্ক্রিন -->
    <div class="container hidden" id="game-screen">
        <h1 id="room-title">রুম কোড: --</h1>
        <p id="room-status-msg">খেলোয়াড়দের কানেকশন চেক করা হচ্ছে...</p>
        
        <!-- ৬x৬ গেম বোর্ড -->
        <div id="game-grid"></div>

        <!-- কে কে কানেক্ট হয়েছে তার লিস্ট বক্স -->
        <div class="connected-box">
            <div style="font-size: 12px; color: #aaa; margin-bottom: 4px;">👥 বর্তমানে রুমে যুক্ত আছেন:</div>
            <div id="players-list-container" style="font-size: 14px; color: #4ecc6d;">কেউ নেই</div>
        </div>

        <button onclick="leaveRoom()" style="background: #dc3545; margin-top: 15px;">রুম ছাড়ুন (Leave Room)</button>
    </div>

<script>
    // ----------------------------------------------------
    // ফায়ারবেস কনফিগারেশন (তোমার ডাটাবেস লিংক এখানে থাকবে)
    // ----------------------------------------------------
    const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
        databaseURL: "YOUR_FIREBASE_DATABASE_URL",
        projectId: "YOUR_FIREBASE_PROJECT_ID",
        storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
        messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
        appId: "YOUR_FIREBASE_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentRoomCode = null;
    let playerName = "";
    let roomRef = null;

    // ৬x৬ গ্রিড তৈরি করা
    function initGrid() {
        const grid = document.getElementById("game-grid");
        grid.innerHTML = "";
        for (let i = 0; i < 36; i++) {
            const cell = document.createElement("div");
            cell.className = "grid-cell";
            cell.id = `cell-${i}`;
            cell.innerText = `[${i+1}]`;
            grid.appendChild(cell);
        }
    }

    // র‍্যান্ডম রুম কোড জেনারেটর
    function generateRoomCode() {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // নতুন রুম ক্রিয়েট করার ফাংশন
    function createRoom() {
        playerName = document.getElementById("player-name").value.trim();
        if (!playerName) {
            alert("দয়া করে আগে আপনার নাম লিখুন!");
            return;
        }

        currentRoomCode = generateRoomCode();
        roomRef = db.ref("rooms/" + currentRoomCode);

        // রুমে হোস্ট হিসেবে এন্ট্রি নেওয়া
        roomRef.set({
            host: playerName,
            createdAt: Date.now(),
            players: {
                [playerName]: { name: playerName, joinedAt: Date.now() }
            }
        }).then(() => {
            enterGameUI(currentRoomCode);
        }).catch((err) => {
            alert("রুম তৈরি করতে সমস্যা হয়েছে: " + err.message);
        });
    }

    // বিদ্যমান রুমে জয়েন করার ফাংশন
    function joinRoom() {
        playerName = document.getElementById("player-name").value.trim();
        const codeInput = document.getElementById("room-code-input").value.trim().toUpperCase();

        if (!playerName) {
            alert("দয়া করে আপনার নাম লিখুন!");
            return;
        }
        if (!codeInput) {
            alert("দয়া করে সঠিক রুম কোড দিন!");
            return;
        }

        currentRoomCode = codeInput;
        roomRef = db.ref("rooms/" + currentRoomCode);

        // চেক করা রুমটি ডাটাবেসে আছে কি না
        roomRef.once("value", (snapshot) => {
            if (snapshot.exists()) {
                // রুমে নতুন প্লেয়ার যোগ করা
                roomRef.child("players/" + playerName).set({
                    name: playerName,
                    joinedAt: Date.now()
                }).then(() => {
                    enterGameUI(currentRoomCode);
                });
            } else {
                alert("এই কোডের কোনো রুম খুঁজে পাওয়া যায়নি! সঠিক কোড দিন।");
            }
        });
    }

    // গেম স্ক্রিন দৃশ্যমান করা
    function enterGameUI(code) {
        document.getElementById("menu-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("room-title").innerText = `রুম কোড: ${code}`;
        document.getElementById("room-status-msg").innerText = `সফলভাবে রুমে যুক্ত হয়েছেন!`;
        
        initGrid();
        monitorRoomPlayers();
    }

    // রিয়েল-টাইমে কে কে রুমে জয়েন করল তা ট্র্যাক করা
    function monitorRoomPlayers() {
        roomRef.child("players").on("value", (snapshot) => {
            const playersData = snapshot.val();
            let namesList = [];
            
            if (playersData) {
                Object.values(playersData).forEach(p => {
                    namesList.push(`🕯️ ${p.name}`);
                });
                
                // স্ক্রিনে দেখাবে কে কানেক্ট হয়েছে
                document.getElementById("players-list-container").innerHTML = namesList.join("<br>");
                document.getElementById("room-status-msg").innerText = `মোট ${namesList.length} জন খেলোয়াড় রুমে আছেন।`;
            }
        });
    }

    // রুম থেকে বের হয়ে যাওয়া
    function leaveRoom() {
        if (roomRef && playerName) {
            roomRef.child("players/" + playerName).remove().then(() => {
                location.reload();
            });
        } else {
            location.reload();
        }
    }
</script>

</body>
</html>
