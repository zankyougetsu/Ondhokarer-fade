<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Night Cage: অন্ধকারের ফাঁদে</title>
    <!-- Firebase SDK (Compat Version for Vanilla JS) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: #14141d;
            --accent-color: #e50914;
            --text-color: #e0e0e0;
            --border-color: #2a2a3d;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: center;
        }
        h1 {
            color: var(--accent-color);
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #aaa;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1f1f2e;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: var(--accent-color);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #b20710;
        }
        .hidden {
            display: none !important;
        }
        #game-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin-top: 15px;
        }
        .grid-cell {
            aspect-ratio: 1;
            background: #1a1a26;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="menu-screen">
        <h1>🕯️ The Night Cage: অন্ধকারের ফাঁদে</h1>
        <p>রিয়েল-টাইম মাল্টিপ্লেয়ার হরর বোর্ড গেম</p>
        
        <input type="text" id="player-name" placeholder="আপনার নাম লিখুন..." maxlength="15">
        
        <button onclick="createRoom()">নতুন রুম তৈরি করুন (Create Room)</button>
        <div style="margin: 10px 0; font-size: 13px; color: #666;">--- অথবা ---</div>
        <input type="text" id="room-code-input" placeholder="রুম কোড দিন (যেমন: ABC1234)">
        <button onclick="joinRoom()" style="background: #28a745;">রুমে প্রবেশ করুন (Join Room)</button>
    </div>

    <div class="container hidden" id="game-screen">
        <h1 id="room-title">রুম: লবি</h1>
        <p id="status-text">খেলোয়াড়দের জন্য অপেক্ষা করা হচ্ছে...</p>
        
        <div id="game-grid">
            <!-- ৬x৬ গেম বোর্ড জেনারেট হবে -->
        </div>

        <button onclick="leaveRoom()" style="background: #dc3545; margin-top: 15px;">রুম ছাড়ুন</button>
    </div>

<script>
    // ----------------------------------------------------
    // ফায়ারবেস কনফিগারেশন (এখানে তোমার ফায়ারবেস প্রজেক্টের ইনফো বসবে)
    // ----------------------------------------------------
    const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
        databaseURL: "YOUR_FIREBASE_DATABASE_URL",
        projectId: "YOUR_FIREBASE_PROJECT_ID",
        storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
        messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
        appId: "YOUR_FIREBASE_APP_ID"
    };

    // ফায়ারবেস ইনিশিয়ালাইজ
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentRoomCode = null;
    let playerName = "";
    let roomRef = null;

    // ৬x৬ গ্রিড রেন্ডার করার ফাংশন
    function initGrid() {
        const grid = document.getElementById("game-grid");
        grid.innerHTML = "";
        for (let i = 0; i < 36; i++) {
            const cell = document.createElement("div");
            cell.className = "grid-cell";
            cell.id = `cell-${i}`;
            grid.appendChild(cell);
        }
    }

    // রুম কোড জেনারেটর
    function generateRoomCode() {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // রুম তৈরি করা
    function createRoom() {
        playerName = document.getElementById("player-name").value.trim();
        if (!playerName) {
            alert("দয়া করে আগে আপনার নাম লিখুন!");
            return;
        }

        currentRoomCode = generateRoomCode();
        roomRef = db.ref("rooms/" + currentRoomCode);

        roomRef.set({
            host: playerName,
            status: "waiting",
            players: {
                [playerName]: { name: playerName, pos: 0 }
            }
        }).then(() => {
            enterGameScreen(currentRoomCode);
        }).catch((error) => {
            alert("রুম তৈরি করতে সমস্যা হয়েছে: " + error.message);
        });
    }

    // রুমে জয়েন করা
    function joinRoom() {
        playerName = document.getElementById("player-name").value.trim();
        const codeInput = document.getElementById("room-code-input").value.trim().toUpperCase();

        if (!playerName) {
            alert("দয়া করে আপনার নাম লিখুন!");
            return;
        }
        if (!codeInput) {
            alert("দয়া করে সঠিক রুম কোড দিন!");
            return;
        }

        currentRoomCode = codeInput;
        roomRef = db.ref("rooms/" + currentRoomCode);

        roomRef.once("value", (snapshot) => {
            if (snapshot.exists()) {
                roomRef.child("players/" + playerName).set({
                    name: playerName,
                    pos: 0
                }).then(() => {
                    enterGameScreen(currentRoomCode);
                });
            } else {
                alert("এই কোডের কোনো রুম খুঁজে পাওয়া যায়নি!");
            }
        });
    }

    // গেম স্ক্রিনে যাওয়ার লজিক
    function enterGameScreen(code) {
        document.getElementById("menu-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("room-title").innerText = `রুম কোড: ${code}`;
        
        initGrid();
        listenToRoomUpdates();
    }

    // রিয়েল-টাইম ডেটা সিংক লজিক
    function listenToRoomUpdates() {
        roomRef.child("players").on("value", (snapshot) => {
            const players = snapshot.val();
            let statusHTML = "<b>রুমের খেলোয়াড়গণ:</b><br>";
            
            // সব সেল ক্লিয়ার করা
            for (let i = 0; i < 36; i++) {
                document.getElementById(`cell-${i}`).innerText = "";
            }

            if (players) {
                Object.values(players).forEach(p => {
                    statusHTML += `${p.name} `;
                    // প্লেয়ারের পজিশন বোর্ডে দেখানো
                    if(document.getElementById(`cell-${p.pos}`)) {
                        document.getElementById(`cell-${p.pos}`).innerText = p.name[0];
                    }
                });
            }
            document.getElementById("status-text").innerHTML = statusHTML;
        });
    }

    // রুম ত্যাগ করা
    function leaveRoom() {
        if (roomRef && playerName) {
            roomRef.child("players/" + playerName).remove();
        }
        location.reload();
    }
</script>

</body>
</html>
